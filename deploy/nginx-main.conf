# base-chat-webui Web – nginx main config (non-root)
#
# Minimal main context: the master process runs as the `nginx` user
# (Docker USER), so no `user` directive and a world-writable pid path.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Non-root: default temp paths under /var/cache/nginx are not writable
    # by the `nginx` user – redirect them to /tmp (world-writable)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}