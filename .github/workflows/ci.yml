name: CI

on:
  push:
    branches: [master, 'feature/*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit signatures
      - name: Check for unexpected packages
        run: node scripts/verify-lockfile.cjs

      - name: Format
        run: npm run format:check

      - run: npm run typecheck
      - run: npm run lint
      - run: npx knip
      - run: npm run depcheck
      - run: npm run pkg:validate
      - run: npm run qmd:setup -w api
      - run: npm test
      - run: npm run build
      - run: npm run size

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w web

      - name: Upload Playwright results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 30
          if-no-files-found: warn

  sql-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chatbot:chatbot@localhost:5432/chatbot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Setup database
        run: bash apps/api/scripts/setup-db.sh

      - name: Test SQL MCP server
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize"}' | \
            DATABASE_URL=$DATABASE_URL node apps/api/scripts/sql-mcp-server.mjs | \
            node -e "
            const lines = require('fs').readFileSync('/dev/stdin','utf8').trim().split('\n');
            const last = JSON.parse(lines[lines.length-1]);
            if (last.result?.serverInfo?.name !== 'sql-products') {
              console.error('FAIL: bad initialize response', JSON.stringify(last));
              process.exit(1);
            }
            console.log('OK: initialize');
          "

      - name: Test search_products
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_products","arguments":{"query":"fisch"}}}' \
            | DATABASE_URL=$DATABASE_URL node apps/api/scripts/sql-mcp-server.mjs | \
          node -e "
            const lines = require('fs').readFileSync('/dev/stdin','utf8').trim().split('\n');
            const last = JSON.parse(lines[lines.length-1]);
            const text = last.result?.content?.[0]?.text ?? '';
            if (!text.includes('Fischbrötchen') && !text.includes('Fisch')) {
              console.error('FAIL: search_products did not return expected results');
              console.error(text);
              process.exit(1);
            }
            console.log('OK: search_products');
            console.log(text);
          "

      - name: Test get_product
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_product","arguments":{"sku":"HAM-001"}}}' \
            | DATABASE_URL=$DATABASE_URL node apps/api/scripts/sql-mcp-server.mjs | \
          node -e "
            const lines = require('fs').readFileSync('/dev/stdin','utf8').trim().split('\n');
            const last = JSON.parse(lines[lines.length-1]);
            const text = last.result?.content?.[0]?.text ?? '';
            if (!text.includes('Fischbrötchen mit Matjes')) {
              console.error('FAIL: get_product did not return expected product');
              console.error(text);
              process.exit(1);
            }
            console.log('OK: get_product');
            console.log(text);
          "

      - name: Test admin-db initialize
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize"}' | \
            DATABASE_URL=$DATABASE_URL node apps/api/scripts/admin-db-mcp-server.mjs | \
            node -e "
            const lines = require('fs').readFileSync('/dev/stdin','utf8').trim().split('\n');
            const last = JSON.parse(lines[lines.length-1]);
            if (last.result?.serverInfo?.name !== 'admin-db') {
              console.error('FAIL: bad initialize response', JSON.stringify(last));
              process.exit(1);
            }
            console.log('OK: admin-db initialize');
          "

      - name: Test admin-db list_tables
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_tables","arguments":{}}}' \
            | DATABASE_URL=$DATABASE_URL node apps/api/scripts/admin-db-mcp-server.mjs | \
          node -e "
            const lines = require('fs').readFileSync('/dev/stdin','utf8').trim().split('\n');
            const last = JSON.parse(lines[lines.length-1]);
            const text = last.result?.content?.[0]?.text ?? '';
            if (!text.includes('products')) {
              console.error('FAIL: list_tables did not include the products table');
              console.error(text);
              process.exit(1);
            }
            console.log('OK: admin-db list_tables');
            console.log(text);
          "

      - name: Test admin-db search_tables
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_tables","arguments":{"query":"sku"}}}' \
            | DATABASE_URL=$DATABASE_URL node apps/api/scripts/admin-db-mcp-server.mjs | \
          node -e "
            const lines = require('fs').readFileSync('/dev/stdin','utf8').trim().split('\n');
            const last = JSON.parse(lines[lines.length-1]);
            const text = last.result?.content?.[0]?.text ?? '';
            if (!text.toLowerCase().includes('products')) {
              console.error('FAIL: search_tables did not match the products table');
              console.error(text);
              process.exit(1);
            }
            console.log('OK: admin-db search_tables');
            console.log(text);
          "

      - name: Test admin-db run_sql (read-only SELECT)
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"run_sql","arguments":{"sql":"SELECT COUNT(*) AS n FROM products"}}}' \
            | DATABASE_URL=$DATABASE_URL node apps/api/scripts/admin-db-mcp-server.mjs | \
          node -e "
            const lines = require('fs').readFileSync('/dev/stdin','utf8').trim().split('\n');
            const last = JSON.parse(lines[lines.length-1]);
            const text = last.result?.content?.[0]?.text ?? '';
            if (!/Zeile/.test(text) || !/[0-9]+/.test(text)) {
              console.error('FAIL: run_sql did not return row data');
              console.error(text);
              process.exit(1);
            }
            console.log('OK: admin-db run_sql SELECT');
            console.log(text);
          "

      - name: Test admin-db run_sql rejects writes and multi-statements
        run: |
          for payload in \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"run_sql","arguments":{"sql":"DELETE FROM products"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"run_sql","arguments":{"sql":"SELECT 1; DROP TABLE products"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"run_sql","arguments":{"sql":"WITH x AS (DELETE FROM products RETURNING 1) SELECT * FROM x"}}}'; do
            OUT=$(printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
              "$payload" \
              | DATABASE_URL=$DATABASE_URL node apps/api/scripts/admin-db-mcp-server.mjs)
            LAST=$(printf '%s\n' "$OUT" | tail -n 1)
            echo "$LAST" | node -e "
              const last = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              const text = last.result?.content?.[0]?.text ?? '';
              if (!/Verweigert/.test(text)) {
                console.error('FAIL: write/multi-statement was NOT rejected');
                console.error(text);
                process.exit(1);
              }
            " || exit 1
          done
          # Database must be intact after the attempts
          COUNT=$(psql "$DATABASE_URL" -tAc "SELECT COUNT(*) FROM products;")
          echo "products rows after attack attempts: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo 'FAIL: products table was modified'; exit 1; }
          echo 'OK: admin-db run_sql is read-only'
