name: CI

on:
  push:
    branches: [master, 'feature/*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit signatures
      - name: Check for unexpected packages
        run: node scripts/verify-lockfile.cjs

      - run: npm run typecheck
      - run: npm run lint
      - run: npx knip
      - run: npm run depcheck
      - run: npm run pkg:validate
      - run: npm test
      - run: npm run build
      - run: npm run size

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w web